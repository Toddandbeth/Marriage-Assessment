<!DOCTYPE html>

<style>

  :root{
    --paper: #F4F0E6;
    --paper-2: #FFFFFF;
    --card: #DEDCCB;
    --ink: #201E19;
    --ink-soft: #55503F;
    --sage: #6E7660;
    --sage-deep: #4B5240;
    --tan: #C7AD84;
    --gold: #A6822F;
    --rust: #9B4A38;
    --line: rgba(32,30,25,0.14);

    --shadow: 0 1px 2px rgba(32,30,25,0.06), 0 8px 24px rgba(32,30,25,0.08);

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{

    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #app{ max-width: 430px; margin: 0 auto; padding: 28px 20px 80px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--sage-deep); font-weight: 600; margin: 0 0 6px;
  }
  h1.display{
    font-family:'Fraunces', serif; font-weight: 600; font-size: clamp(28px, 6vw, 38px);
    line-height: 1.08; margin: 0 0 10px; letter-spacing: -0.01em;
  }
  h1.display em{ font-style: normal; color: var(--sage-deep); }
  p.lede{ font-size: 15.5px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 28px; max-width: 54ch; }
  h2.section-title{ font-family:'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 0 0 4px; }

  .card{ background: var(--paper-2); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; }

  .choice-row{ display:flex; flex-direction:column; gap:12px; margin-top: 22px; }
  .choice-btn{
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    background: var(--card); border: none; border-radius: 16px; padding: 18px 20px;
    font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: var(--ink);
    cursor: pointer; text-align: left; transition: transform 0.12s ease, background 0.12s ease;
  }
  .choice-btn:hover{ background: var(--tan); }
  .choice-btn:active{ transform: scale(0.985); }
  .choice-btn .sub{ display:block; font-weight: 400; font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .choice-btn .arrow{ font-size: 20px; opacity: 0.5; flex-shrink:0; }
  .choice-btn.selected-choice{ background: var(--sage-deep); color: #fff; }
  .choice-btn.selected-choice .sub{ color: rgba(244,240,230,0.8); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--sage-deep); color: #F4F0E6; border: none; border-radius: 999px;
    padding: 14px 26px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .btn:hover{ opacity: 0.92; }
  .btn:active{ transform: scale(0.98); }
  .btn.ghost{ background: transparent; color: var(--sage-deep); border: 1.5px solid var(--sage-deep); }
  .btn.small{ padding: 9px 16px; font-size: 13px; }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; }

  .backlink{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-soft);
    background:none; border:none; cursor:pointer; padding: 0 0 18px; display:flex; align-items:center; gap:6px;
  }
  .backlink:hover{ color: var(--ink); }

  .tiny-link{
    background:none; border:none; cursor:pointer; font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.04em; color: var(--ink-soft); opacity: 0.5; padding: 4px;
  }
  .tiny-link:hover{ opacity: 0.9; }

  label.field-label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; font-weight: 600;
  }
  input[type="text"], input[type="email"]{
    width: 100%; font-family:'IBM Plex Mono', monospace; font-size: 18px; letter-spacing: 0.06em;
    padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="url"]:focus{ outline: 2px solid var(--sage); outline-offset: 1px; }
  input.uppercase{ text-transform: uppercase; }
  input[type="url"]{ width:100%; font-family:'Inter',sans-serif; font-size:14px; padding: 12px 14px; border-radius: 10px; border:1.5px solid var(--line); background: var(--paper); color: var(--ink); }
  input.plain-text{ text-transform:none; font-family:'Inter',sans-serif; font-size:14px; letter-spacing:normal; }

  .code-pill{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: 0.1em;
    background: var(--card); padding: 10px 20px; border-radius: 12px; margin: 6px 0 18px;
  }
  .code-pill.class{ font-size: 26px; }
  .code-pill.private{ font-size: 22px; background: var(--sage-deep); color: #F4F0E6; }

  .progress-track{ height: 6px; background: var(--card); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .progress-fill{ height: 100%; background: var(--sage-deep); border-radius: 999px; transition: width 0.25s ease; }
  .cat-number{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--sage-deep); font-weight: 600; letter-spacing: 0.08em; }

  .statement{ padding: 20px 0; border-bottom: 1px solid var(--line); }
  .statement:last-child{ border-bottom: none; }
  .statement p{ font-size: 16px; line-height: 1.4; margin: 0 0 14px; font-weight: 500; }
  .scale{ display:flex; gap: 8px; }
  .scale button{
    flex: 1; aspect-ratio: 1; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper-2);
    font-family:'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px; color: var(--ink-soft); cursor: pointer;
  }
  .scale button.selected{ background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
  .scale-labels{ display:flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-soft); margin-top: 6px; font-family:'IBM Plex Mono', monospace; }

  .score-row{ display:flex; align-items:center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .score-row:last-child{ border-bottom: none; }
  .score-row .name{ flex: 1; font-weight: 600; font-size: 14.5px; }
  .score-row .bar-track{ flex: 1.3; height: 10px; background: var(--card); border-radius: 999px; overflow:hidden; }
  .score-row .bar-fill{ height: 100%; border-radius: 999px; }
  .score-row .val{ font-family:'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; width: 44px; text-align:right; color: var(--ink-soft); }
  .score-row .chevron{ font-size: 13px; color: var(--ink-soft); width: 14px; text-align:center; flex-shrink:0; }
  .band-tag{
    font-family:'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; color:#fff; flex-shrink:0;
  }

  .detail-panel{ padding: 4px 0 18px 0; }
  .detail-item{ display:flex; align-items:flex-start; justify-content:space-between; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .detail-item:last-child{ border-bottom:none; }
  .detail-item .stext{ font-size: 14px; line-height: 1.4; flex:1; }
  .dots{ display:flex; gap: 4px; flex-shrink:0; align-items:center; }
  .dots .dot{ width: 9px; height: 9px; border-radius: 50%; background: var(--card); }
  .dots .dot.filled{ background: var(--sage-deep); }
  .dots .num{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-left: 6px; width: 12px; }

  .dist-row{ margin-bottom: 20px; }
  .dist-row .cat-head{ display:flex; justify-content: space-between; align-items:baseline; margin-bottom: 8px; }
  .dist-row .cat-head .name{ font-weight: 600; font-size: 15px; }
  .dist-row .cat-head .avg{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }
  .stack{ display:flex; height: 22px; border-radius: 8px; overflow:hidden; background: var(--card); }
  .stack span{ display:block; height:100%; }
  .stack-legend{ display:flex; gap: 14px; margin-top: 6px; flex-wrap:wrap; }
  .stack-legend .item{ display:flex; align-items:center; gap:5px; font-size: 11px; color: var(--ink-soft); font-family:'IBM Plex Mono', monospace; }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  .empty-state{ text-align:center; padding: 40px 20px; color: var(--ink-soft); }
  .empty-state .big{ font-size: 40px; margin-bottom: 10px; }

  .banner{ background: var(--sage-deep); color: #F4F0E6; border-radius: 16px; padding: 16px 18px; margin-bottom: 18px; font-size: 13.5px; line-height: 1.5; }
  .error-banner{ background: #F4E4DF; color: var(--rust); border-radius: 12px; padding: 12px 16px; margin: 10px 0; font-size: 13.5px; }
  .footer-note{ font-size: 12px; color: var(--ink-soft); text-align:center; margin-top: 30px; line-height: 1.5; }
  .footer-note a{ color: var(--ink-soft); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }

  .btn.btn-block{ display:flex; width:100%; justify-content:center; padding:18px 24px; font-size:16px; }

  .cat-row{ border-bottom: 1px solid var(--line); border-radius: 10px; }
  .cat-row:last-child{ border-bottom: none; }
  .cat-row.cat-row-open{ background: rgba(75,82,64,0.07); border-bottom-color: transparent; }
  .cat-row-head{ padding: 14px 16px; cursor: pointer; }
  .cat-row-name{
    font-weight: 600; font-size: 14.5px; margin: 0 0 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cat-row-meta{ display:flex; align-items:center; gap: 12px; }
  .cat-row-meta .bar-track{ flex: 1; height: 10px; background: var(--card); border-radius: 999px; overflow:hidden; }
  .cat-row-meta .bar-fill{ height: 100%; border-radius: 999px; }
  .cat-row-meta .val{ font-family:'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; width: 44px; text-align:right; color: var(--ink-soft); flex-shrink:0; }
  .cat-row-meta .band-tag{ flex-shrink:0; width: 88px; text-align:center; }
  .cat-row .detail-panel{ padding: 0 16px 18px; }

  .guidance-block{ margin-top: 28px; }
  .guidance-block .btn-block{ text-align:left; justify-content:space-between; align-items:center; gap:12px; }
  .guidance-chevron{ font-size: 15px; opacity: 0.75; flex-shrink:0; }
  .guidance-content{ margin-top: 18px; }
  .guidance-section{ margin-bottom: 20px; }
  .guidance-section:last-of-type{ margin-bottom: 0; }
  .guidance-step-title{ font-weight: 700; font-size: 15px; margin: 0 0 6px; }
  .guidance-body{ font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); margin: 0; }
  .guidance-list{ margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); }
  .guidance-list li{ margin-bottom: 4px; }
  .guidance-list li:last-child{ margin-bottom: 0; }

  .leader-group-meta{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em;
    color: var(--ink-soft); margin: 0 0 22px;
  }

  @media print{
    .backlink, #printBtn, .btn, .choice-row, .banner{ display:none !important; }
    body{ background:#fff; }
    .card{ box-shadow:none; border:1px solid #ccc; }
  }

  .print-sheet{ display:none; }

  @media print{
    @page{ size: letter; margin: 0.5in; }
    #app{ max-width: none; padding: 0; }
    .screen-only{ display:none !important; }
    .print-sheet{ display:block !important; font-family: 'Inter', Arial, sans-serif; color:#141310; }

    .print-subline{ display:flex; justify-content: space-between; align-items: baseline; font-size: 10pt; }
    .print-overall strong{ font-size: 15pt; color: var(--sage-deep); margin-left: 4pt; }

    .print-summary-heading, .print-detail-heading{
      font-family:'Fraunces', Georgia, serif; font-weight: 700; font-size: 13pt;
      margin: 0 0 8pt; border-top: 1pt solid #2b2a24; padding-top: 10pt;
    }
    .print-summary-heading{ border-top: none; padding-top: 0; }
    .print-detail-heading{ page-break-before: always; break-before: page; }

    .print-summary-grid{ display:block; margin-bottom: 10pt; }
    .print-cat{ break-inside: avoid; page-break-inside: avoid; border-bottom: 0.5pt solid #ccc; padding: 3pt 0 3pt; }
    .print-cat-top{ display:flex; justify-content: space-between; align-items: baseline; font-size: 10pt; margin-bottom: 2pt; gap: 6pt; }
    .print-cat-name{ font-weight: 600; }
    .print-cat-band{ font-size: 10pt; font-weight: 700; white-space: nowrap; }
    .print-cat-bottom{ display:flex; align-items:center; gap: 10pt; }
    .print-bar-track{ flex:1; height: 6pt; background: #e5e2d6; border-radius: 3pt; overflow: hidden; }
    .print-bar-fill{ height: 100%; }
    .print-cat-score{ font-size: 10pt; font-weight: 600; width: 36pt; text-align: right; flex-shrink: 0; }

    .print-highlight{ font-size: 10pt; line-height: 1.3; margin: 0; }

    .print-detail-page-break{ page-break-before: always; break-before: page; }
    .print-detail-row{ display:flex; gap: 0 18pt; margin-bottom: 11pt; }
    .print-detail-row:last-child{ margin-bottom: 0; }
    .print-detail-col{ flex: 1; min-width: 0; }
    .print-detail-cat{ break-inside: avoid; page-break-inside: avoid; }
    .print-detail-cat-name{ font-weight: 700; font-size: 10pt; margin-bottom: 4pt; border-bottom: 0.5pt solid #999; padding-bottom: 3pt; }
    .print-stmt{ display:flex; justify-content: space-between; align-items: baseline; gap: 8pt; padding: 3pt 0; font-size: 10pt; line-height: 1.3; }
    .print-stmt-text{ flex:1; }
    .print-stmt-dots{ display:flex; gap: 2.5pt; flex-shrink:0; margin-top:1.5pt; }
    .print-dot{ width: 6pt; height: 6pt; border-radius: 50%; background: #ddd; display:inline-block; }
    .print-dot.filled{ background: var(--sage-deep); }

    .print-dist-list{ margin-bottom: 10pt; }
    .print-dist-row{ break-inside: avoid; page-break-inside: avoid; margin-bottom: 10pt; }
    .print-dist-head{ display:flex; justify-content: space-between; align-items: baseline; font-size: 10pt; margin-bottom: 3pt; }
    .print-dist-name{ font-weight: 600; }
    .print-dist-avg{ font-family:'IBM Plex Mono', monospace; font-size: 10pt; color: #555; }
    .print-dist-stack{ display:flex; height: 9pt; border-radius: 4pt; overflow: hidden; background: #e5e2d6; }
    .print-dist-stack span{ display:block; height:100%; }
    .print-dist-legend{ display:flex; gap: 14pt; flex-wrap:wrap; margin-top: 6pt; font-size: 10pt; }
    .print-dist-legend .item{ display:flex; align-items:center; gap: 4pt; }
    .print-dist-swatch{ width: 8pt; height: 8pt; border-radius: 2pt; display:inline-block; }

    .print-guidance{
      margin-top: 0; border-top: none; padding-top: 0;
      page-break-before: always; break-before: page;
    }
    .print-guidance-heading{
      font-family:'Fraunces', Georgia, serif; font-weight: 700; font-size: 13pt; margin: 0 0 10pt;
    }
    .print-guidance-section{ break-inside: avoid; page-break-inside: avoid; margin-bottom: 10pt; }
    .print-guidance-title{ font-weight: 700; font-size: 11pt; margin: 0 0 4pt; }
    .print-guidance-body{ font-size: 10pt; line-height: 1.45; margin: 0; }
    .print-guidance-list{ margin: 0; padding-left: 14pt; font-size: 10pt; line-height: 1.45; }
    .print-guidance-list li{ margin-bottom: 2pt; }

    .print-footer{ margin-top: 14pt; font-size: 10pt; color: #555; text-align:center; }
  }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>

    .replace(/[^A-Z0-9 -]/g, "")

function formatPrintDate(iso){
  try{
    return new Date(iso).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  } catch(e){ return ""; }
}

function makeRetrievalCode(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const bytes = new Uint32Array(10);
  crypto.getRandomValues(bytes);
  let s = "";
  for(let i=0;i<10;i++) s += chars[bytes[i] % chars.length];
  return s.slice(0,5) + "-" + s.slice(5);
}

function assessmentView(){
  const totalSteps = CATEGORIES.length;
  const cat = CATEGORIES[state.step];
  const pct = Math.round((state.step / totalSteps) * 100);
  const answers = state.answers[state.step] || {};
  const allAnswered = cat.statements.every((_, i) => answers[i]);

  const statementsHtml = cat.statements.map((s, i) => `
    <div class="statement">
      <p>${s}</p>
      <div class="scale">
        ${[1,2,3,4,5].map(v => `<button class="scale-btn ${answers[i]===v ? 'selected':''}" data-q="${i}" data-v="${v}">${v}</button>`).join("")}
      </div>
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>

function buildAnswersAndScores(){
  const answers = {}; const scores = {};
  CATEGORIES.forEach((cat, ci) => {
    const arr = [];
    let sum = 0;
    for(let i=0;i<5;i++){ const v = (state.answers[ci] && state.answers[ci][i]) || 0; arr.push(v); sum += v; }
    answers[cat.name] = arr;
    scores[cat.name] = sum;
  });
  return { answers, scores };
}

async function finishAssessment(){
  const { answers, scores } = buildAnswersAndScores();
  state.submitting = true;
  state.submitError = "";
  render();

  let retrievalCode = null;
  let lastError = null;
  for(let attempt=0; attempt<5 && !retrievalCode; attempt++){
    const candidate = makeRetrievalCode();
    const { error } = await supabaseClient.from("submissions").insert({
      class_code: state.classCode,
      retrieval_code: candidate,
      email: state.emailInput || null,
      answers, scores
    });
    if(!error){ retrievalCode = candidate; }
    else if(error.code !== "23505"){ lastError = error; break; }
  }

  state.submitting = false;
  if(!retrievalCode){
    state.submitError = "We couldn't save your results just now. Your answers are still on this screen — check your connection and try again.";
    render();
    return;
  }

  state.viewingSubmission = {
    classCode: state.classCode,
    createdAt: new Date().toISOString(),
    answers, scores,
    retrievalCode,
    justSubmitted: true
  };
  state.expandedCategory = null;
  state.guidanceOpen = false;
  state.view = "results";
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

  render();

}

async function loadLeaderGroups(){
  state.groupsLoading = true; state.groupsError = "";
  render();
  const { data, error } = await supabaseClient.rpc("leader_list_groups", { p_access_code: state.leaderAccessCode });
  state.groupsLoading = false;
  if(error){ state.groupsError = "Couldn't load groups just now. Try refreshing."; render(); return; }
  state.groups = data || [];
  render();
}

async function loadLeaderGroupAggregate(code){
  state.aggLoading = true; state.aggError = ""; state.aggCode = code;
  render();
  const call = code === "ALL"
    ? supabaseClient.rpc("leader_get_all_groups_aggregate", { p_access_code: state.leaderAccessCode })
    : supabaseClient.rpc("get_class_aggregate", { p_class_code: code, p_access_code: state.leaderAccessCode });
  const { data, error } = await call;
  state.aggLoading = false;
  if(error){ state.aggError = "Couldn't load results just now. Try refreshing."; state.aggData = []; render(); return; }
  state.aggData = data || [];
  render();
}

function leaderGroupView(){
  const code = state.aggCode;
  const known = (state.groups || []).find(g => g.code === code);
  const title = code === "ALL" ? "All Groups" : (known ? (known.label || known.code) : code);

  if(state.aggLoading){
    return `<button class="backlink" data-go="leaderDash">&#8592; Back</button><p class="eyebrow">${title}</p><h2 class="section-title">Loading group results&hellip;</h2>`;
  }

  const subs = state.aggData || [];
  const n = subs.length;

  if(state.aggError){
    return `<button class="backlink" data-go="leaderDash">&#8592; Back</button><p class="eyebrow">${title}</p><div class="error-banner">${state.aggError}</div><button class="btn ghost" id="refreshAggBtn">Try again</button>`;
  }

  if(n === 0){
    return `
      <button class="backlink" data-go="leaderDash">&#8592; Back</button>
      <p class="eyebrow">${title}</p>
      <h2 class="section-title">Live group results</h2>
      <div class="empty-state">
        <div class="big">&#9917;</div>
        <p>No submissions yet.</p>
      </div>
      <button class="btn ghost" id="refreshAggBtn">Refresh</button>
    `;
  }

  const bands = [
    { key: "strong", label: "Strong (25)", color: "#6E7660" },
    { key: "good", label: "Very good (20–24)", color: "#8A8F55" },
    { key: "grow", label: "Room to grow (15–19)", color: "#A6822F" },
    { key: "focus", label: "Needs focus (<15)", color: "#9B4A38" }
  ];

  const rows = CATEGORIES.map(cat => {
    const scores = subs.map(s => s.scores[cat.name]).filter(v => typeof v === "number");
    const counts = { strong:0, good:0, grow:0, focus:0 };
    let sum = 0;
    scores.forEach(sc => { counts[bandFor(sc).key]++; sum += sc; });
    const avg = scores.length ? (sum/scores.length).toFixed(1) : "—";
    const segs = bands.map(b => {
      const w = scores.length ? (counts[b.key]/scores.length)*100 : 0;
      return `<span style="width:${w}%; background:${b.color};" title="${b.label}: ${counts[b.key]}"></span>`;
    }).join("");
    return `<div class="dist-row"><div class="cat-head"><span class="name">${cat.name}</span><span class="avg">avg ${avg}/25</span></div><div class="stack">${segs}</div></div>`;
  }).join("");

  const legend = bands.map(b => `<span class="item"><span class="swatch" style="background:${b.color};"></span>${b.label}</span>`).join("");

  const printDistRows = CATEGORIES.map(cat => {
    const scores = subs.map(s => s.scores[cat.name]).filter(v => typeof v === "number");
    const counts = { strong:0, good:0, grow:0, focus:0 };
    let sum = 0;
    scores.forEach(sc => { counts[bandFor(sc).key]++; sum += sc; });
    const avg = scores.length ? (sum/scores.length).toFixed(1) : "—";
    const segs = bands.map(b => {
      const w = scores.length ? (counts[b.key]/scores.length)*100 : 0;
      return `<span style="width:${w}%; background:${b.color};"></span>`;
    }).join("");
    return `<div class="print-dist-row"><div class="print-dist-head"><span class="print-dist-name">${cat.name}</span><span class="print-dist-avg">avg ${avg}/25</span></div><div class="print-dist-stack">${segs}</div></div>`;
  }).join("");
  const printDistLegend = bands.map(b => `<span class="item"><span class="print-dist-swatch" style="background:${b.color};"></span>${b.label}</span>`).join("");

  return `
    <div class="screen-only">
      <button class="backlink" data-go="leaderDash">&#8592; Back to dashboard</button>
      <h1 class="display">${title}</h1>
      <p class="leader-group-meta">${n} response${n===1?"":"s"}</p>
      <div class="card">${rows}<div class="stack-legend">${legend}</div></div>
      <div class="btn-row">
        <button class="btn ghost" id="refreshAggBtn">Refresh results</button>
        <button class="btn ghost" id="exportPdfBtn">Download as PDF</button>
      </div>
    </div>

    <div class="print-sheet">
      <div class="print-header">
        <div class="print-title">${title}</div>
        <div class="print-subline"><span>${n} response${n===1?"":"s"}</span></div>
      </div>
      <div class="print-dist-list">${printDistRows}</div>
      <div class="print-dist-legend">${printDistLegend}</div>
    </div>
  `;
}

function attachHandlers(){
  document.querySelectorAll("[data-go]").forEach(el => {
    el.addEventListener("click", () => { state.view = el.getAttribute("data-go"); render(); });
  });

  // --- take the assessment entry screen ---
  const wantsClassYes = document.getElementById("wantsClassYes");
  if(wantsClassYes) wantsClassYes.addEventListener("click", () => { state.wantsClass = true; state.classCodeError = ""; render(); });

  const wantsClassNo = document.getElementById("wantsClassNo");
  if(wantsClassNo) wantsClassNo.addEventListener("click", () => { state.wantsClass = false; state.classCodeError = ""; render(); });

  const startBtn = document.getElementById("startBtn");
  if(startBtn){
    startBtn.addEventListener("click", async () => {
      if(state.wantsClass === true){
        const codeInput = document.getElementById("codeInput");
        const raw = normalizeCode(codeInput.value);
        state.classCodeInput = raw;
        if(!raw){ state.classCodeError = "Enter a class code, or choose \"No, just for myself\"."; render(); return; }
        state.classCodeChecking = true; state.classCodeError = ""; render();
        const { data, error } = await supabaseClient.rpc("check_group_exists", { p_code: raw });
        state.classCodeChecking = false;
        if(error || !data){
          state.classCodeError = "We couldn't find that class code. Double-check it with your class leader.";
          render();
          return;
        }
        state.classCode = raw;
      } else {
        state.classCode = "GENERAL";
      }
      state.answers = {}; state.step = 0;
      state.view = "assessment";
      render();
    });
  }

  document.querySelectorAll(".scale-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const q = parseInt(btn.getAttribute("data-q"), 10);
      const v = parseInt(btn.getAttribute("data-v"), 10);
      if(!state.answers[state.step]) state.answers[state.step] = {};
      state.answers[state.step][q] = v;
      render();
    });
  });

  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn){
    nextBtn.addEventListener("click", () => {
      if(state.step < CATEGORIES.length - 1){
        state.step++; render(); window.scrollTo({top:0, behavior:"instant"});
      } else {
        finishAssessment();
      }
    });
  }

  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const name = el.getAttribute("data-toggle");
      state.expandedCategory = state.expandedCategory === name ? null : name;
      render();
    });
  });

  const guidanceToggleBtn = document.getElementById("guidanceToggleBtn");
  if(guidanceToggleBtn){
    guidanceToggleBtn.addEventListener("click", () => {
      state.guidanceOpen = !state.guidanceOpen;
      render();
    });
  }

  const printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.addEventListener("click", () => window.print());

  const lookupInput = document.getElementById("lookupInput");
  const lookupBtn = document.getElementById("lookupBtn");
  if(lookupBtn){
    lookupBtn.addEventListener("click", () => {
      const v = (lookupInput.value || "").toUpperCase().trim();
      state.lookupCode = v;
      if(v) runLookup(v);
    });
  }

  // --- leader access ---
  const leaderLoginLink = document.getElementById("leaderLoginLink");
  if(leaderLoginLink){
    leaderLoginLink.addEventListener("click", () => {
      if(state.leaderVerified){ state.view = "leaderDash"; loadLeaderGroups(); }
      else { state.view = "leaderLogin"; render(); }
    });
  }

  const goDashBtn = document.getElementById("goDashBtn");
  if(goDashBtn) goDashBtn.addEventListener("click", () => { state.view = "leaderDash"; loadLeaderGroups(); });

  const leaderCodeSubmitBtn = document.getElementById("leaderCodeSubmitBtn");
  if(leaderCodeSubmitBtn){
    leaderCodeSubmitBtn.addEventListener("click", async () => {
      const input = document.getElementById("leaderCodeInputEl");
      const code = (input.value || "").trim();
      state.leaderCodeInput = code;
      if(!code){ state.leaderLoginError = "Enter the access code."; render(); return; }
      state.leaderVerifying = true; state.leaderLoginError = ""; render();
      const { data, error } = await supabaseClient.rpc("verify_leader_code", { p_access_code: code });
      state.leaderVerifying = false;
      if(error || data !== true){
        state.leaderLoginError = "That code isn't correct. Try again.";
        render();
        return;
      }
      state.leaderAccessCode = code;
      state.leaderVerified = true;
      localStorage.setItem(LEADER_CODE_KEY, code);
      state.view = "leaderDash";
      await loadLeaderGroups();
    });
  }

  // --- leader dashboard ---
  const leaderLogoutBtn = document.getElementById("leaderLogoutBtn");
  if(leaderLogoutBtn){
    leaderLogoutBtn.addEventListener("click", () => {
      localStorage.removeItem(LEADER_CODE_KEY);
      state.leaderAccessCode = "";
      state.leaderVerified = false;
      state.view = "home";
      render();
    });
  }

  const refreshGroupsBtn = document.getElementById("refreshGroupsBtn");
  if(refreshGroupsBtn) refreshGroupsBtn.addEventListener("click", loadLeaderGroups);

  document.querySelectorAll("[data-view-group]").forEach(el => {
    el.addEventListener("click", () => {
      const code = el.getAttribute("data-view-group");
      state.view = "leaderGroup";
      loadLeaderGroupAggregate(code);
    });
  });

  const createGroupBtn = document.getElementById("createGroupBtn");
  if(createGroupBtn){
    createGroupBtn.addEventListener("click", async () => {
      const codeEl = document.getElementById("newGroupCode");
      const labelEl = document.getElementById("newGroupLabel");
      const code = normalizeCode(codeEl.value);
      const label = (labelEl.value || "").trim();
      if(!code){ state.newGroupError = "Enter a code for the new group."; render(); return; }
      state.newGroupCreating = true; state.newGroupError = ""; render();
      const { error } = await supabaseClient.rpc("leader_create_group", { p_code: code, p_label: label || null, p_access_code: state.leaderAccessCode });
      state.newGroupCreating = false;
      if(error){
        state.newGroupError = (error.message || "").includes("code_taken")
          ? `"${code}" is already in use — pick another code.`
          : "Something went wrong creating that group. Try again.";
        render();
        return;
      }
      await loadLeaderGroups();
    });
  }

  // --- leader group / all-groups aggregate view ---
  const refreshAggBtn = document.getElementById("refreshAggBtn");
  if(refreshAggBtn) refreshAggBtn.addEventListener("click", () => loadLeaderGroupAggregate(state.aggCode));

  const exportPdfBtn = document.getElementById("exportPdfBtn");
  if(exportPdfBtn) exportPdfBtn.addEventListener("click", () => window.print());
}

render();
initLeaderAccess();
</script>
</body>
</html>
