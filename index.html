  *{ box-sizing:border-box; }

  h1.display{

  .card{ background: var(--paper-2); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; }

  .choice-row{ display:flex; flex-direction:column; gap:12px; margin-top: 22px; }
  .choice-btn{

    background: var(--card); border: none; border-radius: 16px; padding: 18px 20px;
    font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: var(--ink);
    cursor: pointer; text-align: left; transition: transform 0.12s ease, background 0.12s ease;
  }
  .choice-btn:hover{ background: var(--tan); }
  .choice-btn:active{ transform: scale(0.985); }
  .choice-btn .sub{ display:block; font-weight: 400; font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .choice-btn .arrow{ font-size: 20px; opacity: 0.5; flex-shrink:0; }
  .choice-btn.selected-choice{ background: var(--sage-deep); color: #fff; }
  .choice-btn.selected-choice .sub{ color: rgba(244,240,230,0.8); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--sage-deep); color: #F4F0E6; border: none; border-radius: 999px;
    padding: 14px 26px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .btn:hover{ opacity: 0.92; }
  .btn:active{ transform: scale(0.98); }
  .btn.ghost{ background: transparent; color: var(--sage-deep); border: 1.5px solid var(--sage-deep); }
  .btn.small{ padding: 9px 16px; font-size: 13px; }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; }

  .backlink{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-soft);
    background:none; border:none; cursor:pointer; padding: 0 0 18px; display:flex; align-items:center; gap:6px;
  }
  .backlink:hover{ color: var(--ink); }

  .tiny-link{
    background:none; border:none; cursor:pointer; font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.04em; color: var(--ink-soft); opacity: 0.5; padding: 4px;
  }
  .tiny-link:hover{ opacity: 0.9; }

  label.field-label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; font-weight: 600;
  }
  input[type="text"], input[type="email"]{
    width: 100%; font-family:'IBM Plex Mono', monospace; font-size: 18px; letter-spacing: 0.06em;
    padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="url"]:focus{ outline: 2px solid var(--sage); outline-offset: 1px; }
  input.uppercase{ text-transform: uppercase; }
  input[type="url"]{ width:100%; font-family:'Inter',sans-serif; font-size:14px; padding: 12px 14px; border-radius: 10px; border:1.5px solid var(--line); background: var(--paper); color: var(--ink); }
  input.plain-text{ text-transform:none; font-family:'Inter',sans-serif; font-size:14px; letter-spacing:normal; }

  .code-pill.class{ font-size: 26px; }
  .code-pill.private{ font-size: 22px; background: var(--sage-deep); color: #F4F0E6; }

  .progress-fill{ height: 100%; background: var(--sage-deep); border-radius: 999px; transition: width 0.25s ease; }
  .cat-number{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--sage-deep); font-weight: 600; letter-spacing: 0.08em; }

  .statement{ padding: 20px 0; border-bottom: 1px solid var(--line); }
  .statement:last-child{ border-bottom: none; }
  .statement p{ font-size: 16px; line-height: 1.4; margin: 0 0 14px; font-weight: 500; }
  .scale{ display:flex; gap: 8px; }
  .scale button{
    flex: 1; aspect-ratio: 1; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper-2);
    font-family:'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px; color: var(--ink-soft); cursor: pointer;

  .scale button.selected{ background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
  .scale-labels{ display:flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-soft); margin-top: 6px; font-family:'IBM Plex Mono', monospace; }

  .score-row .name{ flex: 1; font-weight: 600; font-size: 14.5px; }

  .detail-item .stext{ font-size: 14px; line-height: 1.4; flex:1; }
  .dots{ display:flex; gap: 4px; flex-shrink:0; align-items:center; }

  .dots .num{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-left: 6px; width: 12px; }

  .stack-legend{ display:flex; gap: 14px; margin-top: 6px; flex-wrap:wrap; }

  .guidance-body{ font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 22px; }

    @page{ size: letter; margin: 0.5in; }
    #app{ max-width: none; padding: 0; }
    .screen-only{ display:none !important; }
    .print-sheet{ display:block !important; font-family: 'Inter', Arial, sans-serif; color:#141310; }

    .print-title{ font-family:'Fraunces', Georgia, serif; font-size: 16pt; font-weight: 700; margin: 0 0 4pt; }

    .print-summary-heading{ border-top: none; padding-top: 0; }

    .print-summary-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 7pt 18pt; margin-bottom: 14pt; }
    .print-cat{ break-inside: avoid; page-break-inside: avoid; border-bottom: 0.5pt solid #ccc; padding-bottom: 6pt; }
    .print-cat-top{ display:flex; justify-content: space-between; align-items: baseline; font-size: 10pt; margin-bottom: 4pt; gap: 6pt; }
    .print-cat-name{ font-weight: 600; }
    .print-cat-band{ font-size: 10pt; font-weight: 700; white-space: nowrap; }
    .print-cat-bottom{ display:flex; align-items:center; gap: 8pt; }
    .print-bar-track{ flex:1; height: 6pt; background: #e5e2d6; border-radius: 3pt; overflow: hidden; }
    .print-bar-fill{ height: 100%; }
    .print-cat-score{ font-size: 10pt; font-weight: 600; width: 36pt; text-align: right; flex-shrink: 0; }

    .print-highlight{ font-size: 10pt; line-height: 1.4; margin: 0 0 4pt; }

    .print-detail-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 0 18pt; }
    .print-detail-cat{ break-inside: avoid; page-break-inside: avoid; margin-bottom: 11pt; }
    .print-detail-cat-name{ font-weight: 700; font-size: 10pt; margin-bottom: 4pt; border-bottom: 0.5pt solid #999; padding-bottom: 3pt; }
    .print-stmt{ display:flex; justify-content: space-between; align-items: baseline; gap: 8pt; padding: 3pt 0; font-size: 10pt; line-height: 1.3; }
    .print-stmt-text{ flex:1; }
    .print-stmt-dots{ display:flex; gap: 2.5pt; flex-shrink:0; margin-top:1.5pt; }
    .print-dot{ width: 6pt; height: 6pt; border-radius: 50%; background: #ddd; display:inline-block; }
    .print-dot.filled{ background: var(--sage-deep); }

    .print-guidance{ margin-top: 4pt; border-top: 1pt solid #2b2a24; padding-top: 10pt; }
    .print-guidance-title{ font-weight: 700; font-size: 11pt; margin: 0 0 4pt; }
    .print-guidance-body{ font-size: 10pt; line-height: 1.45; margin: 0 0 11pt; }
    .print-guidance-body:last-child{ margin-bottom: 0; }

    .print-footer{ margin-top: 14pt; font-size: 10pt; color: #555; text-align:center; }
  }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>

function bandFor(score){
  if(score === 25) return { key:"strong", label: "Strong", color: "#6E7660" };
  if(score >= 20) return { key:"good", label: "Very good", color: "#8A8F55" };
  if(score >= 15) return { key:"grow", label: "Room to grow", color: "#A6822F" };
  return { key:"focus", label: "Needs focus", color: "#9B4A38" };
}

function formatPrintDate(iso){
  try{
    return new Date(iso).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  } catch(e){ return ""; }
}

function makeRetrievalCode(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const bytes = new Uint32Array(10);
  crypto.getRandomValues(bytes);
  let s = "";
  for(let i=0;i<10;i++) s += chars[bytes[i] % chars.length];
  return s.slice(0,5) + "-" + s.slice(5);
}

function assessmentView(){
  const totalSteps = CATEGORIES.length;
  const cat = CATEGORIES[state.step];
  const pct = Math.round((state.step / totalSteps) * 100);
  const answers = state.answers[state.step] || {};
  const allAnswered = cat.statements.every((_, i) => answers[i]);

  const statementsHtml = cat.statements.map((s, i) => `
    <div class="statement">
      <p>${s}</p>
      <div class="scale">
        ${[1,2,3,4,5].map(v => `<button class="scale-btn ${answers[i]===v ? 'selected':''}" data-q="${i}" data-v="${v}">${v}</button>`).join("")}
      </div>
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
  `).join("");

  return `

      ${state.step === totalSteps - 1 ? "Finish assessment" : "Next category"}
    </button>
  `;
}

function buildAnswersAndScores(){
  const answers = {}; const scores = {};
  CATEGORIES.forEach((cat, ci) => {
    const arr = [];
    let sum = 0;
    for(let i=0;i<5;i++){ const v = (state.answers[ci] && state.answers[ci][i]) || 0; arr.push(v); sum += v; }
    answers[cat.name] = arr;
    scores[cat.name] = sum;
  });
  return { answers, scores };
}

async function finishAssessment(){
  const { answers, scores } = buildAnswersAndScores();
  state.submitting = true;
  state.submitError = "";
  render();

  let retrievalCode = null;
  let lastError = null;
  for(let attempt=0; attempt<5 && !retrievalCode; attempt++){
    const candidate = makeRetrievalCode();
    const { error } = await supabaseClient.from("submissions").insert({
      class_code: state.classCode,
      retrieval_code: candidate,
      email: state.emailInput || null,
      answers, scores
    });
    if(!error){ retrievalCode = candidate; }
    else if(error.code !== "23505"){ lastError = error; break; }
  }

  state.submitting = false;
  if(!retrievalCode){
    state.submitError = "We couldn't save your results just now. Your answers are still on this screen — check your connection and try again.";
    render();
    return;
  }

  state.viewingSubmission = {
    classCode: state.classCode,
    createdAt: new Date().toISOString(),
    answers, scores,
    retrievalCode,
    justSubmitted: true
  };
  state.expandedCategory = null;
  state.view = "results";
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

function exportCSV(code, subs){
  const header = ["submission_time", ...CATEGORIES.map(c => c.name)];
  const lines = [header.map(csvSafe).join(",")];
  subs.forEach(s => {
    const row = [new Date(s.created_at).toISOString(), ...CATEGORIES.map(c => (s.scores[c.name] ?? ""))];
    lines.push(row.map(csvSafe).join(","));
  });
  const csv = lines.join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `marriage-assessment-${code === "ALL" ? "all-groups" : code}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function csvSafe(v){
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}

  const startBtn = document.getElementById("startBtn");
  if(startBtn){
    startBtn.addEventListener("click", async () => {
      if(state.wantsClass === true){
        const codeInput = document.getElementById("codeInput");

        if(!raw){ state.classCodeError = "Enter a class code, or choose \"No, just for myself\"."; render(); return; }
        state.classCodeChecking = true; state.classCodeError = ""; render();
        const { data, error } = await supabaseClient.rpc("check_group_exists", { p_code: raw });
        state.classCodeChecking = false;
        if(error || !data){
          state.classCodeError = "We couldn't find that class code. Double-check it with your class leader.";
          render();
          return;
        }
        state.classCode = raw;
      } else {
        state.classCode = "GENERAL";
      }
      state.answers = {}; state.step = 0;
      state.view = "assessment";
      render();
    });
  }

  document.querySelectorAll(".scale-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const q = parseInt(btn.getAttribute("data-q"), 10);
      const v = parseInt(btn.getAttribute("data-v"), 10);
      if(!state.answers[state.step]) state.answers[state.step] = {};
      state.answers[state.step][q] = v;
      render();
    });
  });

  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn){
    nextBtn.addEventListener("click", () => {
      if(state.step < CATEGORIES.length - 1){
        state.step++; render(); window.scrollTo({top:0, behavior:"instant"});
      } else {
        finishAssessment();
      }
    });
  }

  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const name = el.getAttribute("data-toggle");
      state.expandedCategory = state.expandedCategory === name ? null : name;
      render();
    });
  });

  const printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.addEventListener("click", () => window.print());

  const lookupInput = document.getElementById("lookupInput");
  const lookupBtn = document.getElementById("lookupBtn");
  if(lookupBtn){
    lookupBtn.addEventListener("click", () => {
      const v = (lookupInput.value || "").toUpperCase().trim();
      state.lookupCode = v;
      if(v) runLookup(v);
    });
  }

  // --- leader access ---
  const leaderLoginLink = document.getElementById("leaderLoginLink");
  if(leaderLoginLink){
    leaderLoginLink.addEventListener("click", () => {
      if(state.leaderVerified){ state.view = "leaderDash"; loadLeaderGroups(); }
      else { state.view = "leaderLogin"; render(); }
    });
  }

  const goDashBtn = document.getElementById("goDashBtn");
  if(goDashBtn) goDashBtn.addEventListener("click", () => { state.view = "leaderDash"; loadLeaderGroups(); });

  const leaderCodeSubmitBtn = document.getElementById("leaderCodeSubmitBtn");
  if(leaderCodeSubmitBtn){
    leaderCodeSubmitBtn.addEventListener("click", async () => {
      const input = document.getElementById("leaderCodeInputEl");
      const code = (input.value || "").trim();
      state.leaderCodeInput = code;
      if(!code){ state.leaderLoginError = "Enter the access code."; render(); return; }
      state.leaderVerifying = true; state.leaderLoginError = ""; render();
      const { data, error } = await supabaseClient.rpc("verify_leader_code", { p_access_code: code });
      state.leaderVerifying = false;
      if(error || data !== true){
        state.leaderLoginError = "That code isn't correct. Try again.";
        render();
        return;
      }
      state.leaderAccessCode = code;
      state.leaderVerified = true;
      localStorage.setItem(LEADER_CODE_KEY, code);
      state.view = "leaderDash";
      await loadLeaderGroups();
    });
  }

  // --- leader dashboard ---
  const leaderLogoutBtn = document.getElementById("leaderLogoutBtn");
  if(leaderLogoutBtn){
    leaderLogoutBtn.addEventListener("click", () => {
      localStorage.removeItem(LEADER_CODE_KEY);
      state.leaderAccessCode = "";
      state.leaderVerified = false;
      state.view = "home";
      render();
    });
  }

  const refreshGroupsBtn = document.getElementById("refreshGroupsBtn");
  if(refreshGroupsBtn) refreshGroupsBtn.addEventListener("click", loadLeaderGroups);

  document.querySelectorAll("[data-view-group]").forEach(el => {
    el.addEventListener("click", () => {
      const code = el.getAttribute("data-view-group");
      state.view = "leaderGroup";
      loadLeaderGroupAggregate(code);
    });
  });

  const createGroupBtn = document.getElementById("createGroupBtn");
  if(createGroupBtn){
    createGroupBtn.addEventListener("click", async () => {
      const codeEl = document.getElementById("newGroupCode");
      const labelEl = document.getElementById("newGroupLabel");
      const code = (codeEl.value || "").toUpperCase().replace(/[^A-Z0-9-]/g,"");
      const label = (labelEl.value || "").trim();
      if(!code){ state.newGroupError = "Enter a code for the new group."; render(); return; }
      state.newGroupCreating = true; state.newGroupError = ""; render();
      const { error } = await supabaseClient.rpc("leader_create_group", { p_code: code, p_label: label || null, p_access_code: state.leaderAccessCode });
      state.newGroupCreating = false;
      if(error){
        state.newGroupError = (error.message || "").includes("code_taken")
          ? `"${code}" is already in use — pick another code.`
          : "Something went wrong creating that group. Try again.";
        render();
        return;
      }
      await loadLeaderGroups();
    });
  }

  // --- leader group / all-groups aggregate view ---
  const refreshAggBtn = document.getElementById("refreshAggBtn");
  if(refreshAggBtn) refreshAggBtn.addEventListener("click", () => loadLeaderGroupAggregate(state.aggCode));

  const exportAggBtn = document.getElementById("exportAggBtn");
  if(exportAggBtn) exportAggBtn.addEventListener("click", () => exportCSV(state.aggCode, state.aggData || []));

  const exportPdfBtn = document.getElementById("exportPdfBtn");
  if(exportPdfBtn) exportPdfBtn.addEventListener("click", () => window.print());
}

render();
initLeaderAccess();
</script>
</body>
</html>
