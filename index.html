<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intentional Marriage Assessment</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

  :root{
    --paper: #F4F0E6;
    --paper-2: #FFFFFF;
    --card: #DEDCCB;
    --ink: #201E19;
    --ink-soft: #55503F;
    --sage: #6E7660;
    --sage-deep: #4B5240;
    --tan: #C7AD84;
    --gold: #A6822F;
    --rust: #9B4A38;
    --line: rgba(32,30,25,0.14);
    --radius: 22px;
    --shadow: 0 1px 2px rgba(32,30,25,0.06), 0 8px 24px rgba(32,30,25,0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #app{ max-width: 430px; margin: 0 auto; padding: 28px 20px 80px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--sage-deep); font-weight: 600; margin: 0 0 6px;
  }
  h1.display{
    font-family:'Fraunces', serif; font-weight: 600; font-size: clamp(28px, 6vw, 38px);
    line-height: 1.08; margin: 0 0 10px; letter-spacing: -0.01em;
  }
  h1.display em{ font-style: normal; color: var(--sage-deep); }
  p.lede{ font-size: 15.5px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 28px; max-width: 54ch; }
  h2.section-title{ font-family:'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 0 0 4px; }

  .card{ background: var(--paper-2); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; }

  .choice-row{ display:flex; flex-direction:column; gap:12px; margin-top: 22px; }
  .choice-btn{
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    background: var(--card); border: none; border-radius: 16px; padding: 18px 20px;
    font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: var(--ink);
    cursor: pointer; text-align: left; transition: transform 0.12s ease, background 0.12s ease;
  }
  .choice-btn:hover{ background: var(--tan); }
  .choice-btn:active{ transform: scale(0.985); }
  .choice-btn .sub{ display:block; font-weight: 400; font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .choice-btn .arrow{ font-size: 20px; opacity: 0.5; flex-shrink:0; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--sage-deep); color: #F4F0E6; border: none; border-radius: 999px;
    padding: 14px 26px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity 0.12s ease, transform 0.12s ease;

  .btn:hover{ opacity: 0.92; }
  .btn:active{ transform: scale(0.98); }

  .btn.small{ padding: 9px 16px; font-size: 13px; }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; }

  .backlink{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-soft);

  label.field-label{

    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; font-weight: 600;

  input[type="text"], input[type="email"]{

    padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);

  .scale button{

  .scale-labels{ display:flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-soft); margin-top: 6px; font-family:'IBM Plex Mono', monospace; }

  .score-row .chevron{ font-size: 13px; color: var(--ink-soft); width: 14px; text-align:center; flex-shrink:0; }
  .band-tag{
    font-family:'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;

  }

  .detail-panel{ padding: 4px 0 18px 0; }
  .detail-item{ display:flex; align-items:flex-start; justify-content:space-between; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .detail-item:last-child{ border-bottom:none; }
  .detail-item .stext{ font-size: 14px; line-height: 1.4; flex:1; }
  .dots{ display:flex; gap: 4px; flex-shrink:0; align-items:center; }
  .dots .dot{ width: 9px; height: 9px; border-radius: 50%; background: var(--card); }
  .dots .dot.filled{ background: var(--sage-deep); }
  .dots .num{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-left: 6px; width: 12px; }

  .dist-row{ margin-bottom: 20px; }
  .dist-row .cat-head{ display:flex; justify-content: space-between; align-items:baseline; margin-bottom: 8px; }
  .dist-row .cat-head .name{ font-weight: 600; font-size: 15px; }
  .dist-row .cat-head .avg{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }
  .stack{ display:flex; height: 22px; border-radius: 8px; overflow:hidden; background: var(--card); }
  .stack span{ display:block; height:100%; }
  .stack-legend{ display:flex; gap: 14px; margin-top: 6px; flex-wrap:wrap; }
  .stack-legend .item{ display:flex; align-items:center; gap:5px; font-size: 11px; color: var(--ink-soft); font-family:'IBM Plex Mono', monospace; }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  .empty-state{ text-align:center; padding: 40px 20px; color: var(--ink-soft); }
  .empty-state .big{ font-size: 40px; margin-bottom: 10px; }

  .banner{ background: var(--sage-deep); color: #F4F0E6; border-radius: 16px; padding: 16px 18px; margin-bottom: 18px; font-size: 13.5px; line-height: 1.5; }
  .error-banner{ background: #F4E4DF; color: var(--rust); border-radius: 12px; padding: 12px 16px; margin: 10px 0; font-size: 13.5px; }
  .footer-note{ font-size: 12px; color: var(--ink-soft); text-align:center; margin-top: 30px; line-height: 1.5; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }

  @media print{
    .backlink, #printBtn, .btn, .choice-row, .banner{ display:none !important; }
    body{ background:#fff; }
    .card{ box-shadow:none; border:1px solid #ccc; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>

function bandFor(score){
  if(score === 25) return { key:"strong", label: "Strong", color: "#6E7660" };
  if(score >= 20) return { key:"good", label: "Very good", color: "#8A8F55" };
  if(score >= 15) return { key:"grow", label: "Room to grow", color: "#A6822F" };
  return { key:"focus", label: "Needs focus", color: "#9B4A38" };
}

function getParam(name){
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

function makeClassCode(){
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  let c = "";
  for(let i=0;i<4;i++) c += letters[Math.floor(Math.random()*letters.length)];
  return c;
}

function makeRetrievalCode(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const bytes = new Uint32Array(10);
  crypto.getRandomValues(bytes);
  let s = "";
  for(let i=0;i<10;i++) s += chars[bytes[i] % chars.length];
  return s.slice(0,5) + "-" + s.slice(5);
}

const state = {

}

}

function assessmentView(){
  const totalSteps = CATEGORIES.length;
  const cat = CATEGORIES[state.step];
  const pct = Math.round((state.step / totalSteps) * 100);
  const answers = state.answers[state.step] || {};
  const allAnswered = cat.statements.every((_, i) => answers[i]);

  const statementsHtml = cat.statements.map((s, i) => `
    <div class="statement">
      <p>${s}</p>
      <div class="scale">
        ${[1,2,3,4,5].map(v => `<button class="scale-btn ${answers[i]===v ? 'selected':''}" data-q="${i}" data-v="${v}">${v}</button>`).join("")}
      </div>
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
  `).join("");

  return `
    <button class="backlink" data-go="joinCode">&#8592; Start over</button>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <p class="cat-number">Category ${state.step + 1} of ${totalSteps}</p>
    <h2 class="section-title">${cat.name}</h2>
    <div class="card" style="margin-top:16px;">${statementsHtml}</div>
    <button class="btn" id="nextBtn" ${allAnswered ? "" : "disabled"}>
      ${state.step === totalSteps - 1 ? "Finish assessment" : "Next category"}
    </button>
  `;
}

function buildAnswersAndScores(){
  const answers = {}; const scores = {};
  CATEGORIES.forEach((cat, ci) => {
    const arr = [];
    let sum = 0;
    for(let i=0;i<5;i++){ const v = (state.answers[ci] && state.answers[ci][i]) || 0; arr.push(v); sum += v; }
    answers[cat.name] = arr;
    scores[cat.name] = sum;
  });
  return { answers, scores };
}

async function finishAssessment(){
  const { answers, scores } = buildAnswersAndScores();
  state.submitting = true;
  state.submitError = "";
  render();

  let retrievalCode = null;
  let lastError = null;
  for(let attempt=0; attempt<5 && !retrievalCode; attempt++){
    const candidate = makeRetrievalCode();
    const { error } = await supabaseClient.from("submissions").insert({
      class_code: state.classCode || null,
      retrieval_code: candidate,
      email: state.emailInput || null,
      answers, scores
    });
    if(!error){ retrievalCode = candidate; }
    else if(error.code !== "23505"){ lastError = error; break; }
  }

  state.submitting = false;
  if(!retrievalCode){
    state.submitError = "We couldn't save your results just now. Your answers are still on this screen — check your connection and try again.";
    render();
    return;
  }

  state.viewingSubmission = {
    classCode: state.classCode || null,
    createdAt: new Date().toISOString(),
    answers, scores,
    retrievalCode,
    justSubmitted: true
  };
  state.expandedCategory = null;
  state.view = "results";
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

}

async function runLookup(code){
  state.lookupError = "";
  render();
  const { data, error } = await supabaseClient.rpc("get_submission_by_code", { p_code: code });
  if(error || !data || data.length === 0){
    state.lookupError = "We couldn't find a result with that code. Double check it and try again.";
    render();
    return;
  }
  const row = data[0];
  state.viewingSubmission = {
    classCode: row.class_code,
    createdAt: row.created_at,
    answers: row.answers,
    scores: row.scores,
    retrievalCode: code,
    justSubmitted: false
  };
  state.expandedCategory = null;
  state.view = "results";
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

function resultsView(){
  const sub = state.viewingSubmission;
  const scores = sub.scores;
  const answers = sub.answers;
  const total = Object.values(scores).reduce((a,b)=>a+b,0);
  const maxTotal = CATEGORIES.length * 25;

  const rows = CATEGORIES.map(cat => {
    const score = scores[cat.name];
    const band = bandFor(score);
    const pct = Math.round((score/25)*100);
    const isOpen = state.expandAll || state.expandedCategory === cat.name;
    const detail = isOpen ? `
      <div class="detail-panel">
        ${cat.statements.map((s,i) => {
          const v = (answers[cat.name] && answers[cat.name][i]) || 0;
          const dots = [1,2,3,4,5].map(d => `<span class="dot ${d<=v?'filled':''}"></span>`).join("");
          return `<div class="detail-item"><div class="stext">${s}</div><div class="dots">${dots}<span class="num">${v}</span></div></div>`;
        }).join("")}
      </div>
    ` : "";
    return `
      <div>
        <div class="score-row" data-toggle="${cat.name}">
          <span class="chevron">${isOpen ? "\u25be" : "\u25b8"}</span>
          <div class="name">${cat.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${band.color};"></div></div>
          <div class="val">${score}/25</div>
          <div class="band-tag" style="background:${band.color};">${band.label}</div>
        </div>
        ${detail}
      </div>
    `;
  }).join("");

  const lowest = Object.entries(scores).sort((a,b)=>a[1]-b[1])[0];
  const highest = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  const mailBody = encodeURIComponent(`Here is my private results code for the Intentional Marriage Assessment: ${sub.retrievalCode}\n\nKeep this to look up your results again any time at the assessment link your class leader shared.`);

  return `
    ${!sub.justSubmitted ? `<button class="backlink" data-go="home">&#8592; Back</button>` : ""}
    <p class="eyebrow">Your results</p>
    <h1 class="display">Here's where you <em>are</em> right now.</h1>
    <p class="lede">This isn't a grade, it's a starting point for a conversation with your spouse. Tap into any category below to see exactly which statements shaped that score, then sit down together and compare.</p>
    ${sub.justSubmitted ? `
      <div class="banner">
        <strong>Save this code, it's the only way back in:</strong><br>
        <span class="code-pill private">${sub.retrievalCode}</span><br>
        Nobody else, including your class leader, can look up your results without it. Write it down, screenshot it, or email it to yourself below.
      </div>
      <div class="btn-row" style="margin-bottom:22px;">
        <a class="btn small ghost" style="text-decoration:none;" href="mailto:?subject=My%20assessment%20code&body=${mailBody}">Email this code to myself</a>
      </div>
    ` : ""}
    ${sub.classCode ? `<p class="footer-note" style="text-align:left; margin-top:0;">Part of class ${sub.classCode}. Your leader only ever sees anonymous group totals, never this screen.</p>` : ""}
    <div class="card">
      <div class="score-row" style="border-bottom:1.5px solid var(--line); margin-bottom:6px; cursor:default;">
        <span class="chevron"></span>
        <div class="name" style="font-family:'Fraunces',serif; font-size:16px;">Overall</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((total/maxTotal)*100)}%; background:var(--sage-deep);"></div></div>
        <div class="val">${total}/${maxTotal}</div>
      </div>
      ${rows}
    </div>
    <p class="lede" style="margin-top:4px;">The strongest area right now is <strong>${highest[0]}</strong>. The area that could use the most attention is <strong>${lowest[0]}</strong>.</p>
    <div class="btn-row">
      <button class="btn" id="printBtn">Print or save as PDF</button>
      <button class="btn ghost" data-go="home">Done</button>
    </div>
    <p class="footer-note">For a deeper walkthrough of these results together, see Intentional Marriage or the 30-Day Intentional Marriage Challenge at IntentionalMinistries.com.</p>
  `;
}

async function loadAggregate(code){
  state.aggLoading = true;
  state.aggError = "";
  render();
  const { data, error } = await supabaseClient.rpc("get_class_aggregate", { p_class_code: code });
  state.aggLoading = false;
  if(error){ state.aggError = "Couldn't load results just now. Try refreshing."; state.aggData = []; render(); return; }
  state.aggData = data || [];
  render();
}

function facilitatorDashView(){
  const code = state.facilitatorCode || state.aggCode;
  if(state.aggLoading){
    return `<button class="backlink" data-go="facilitatorSetup">&#8592; Back</button><p class="eyebrow">Class ${code}</p><h2 class="section-title">Loading group results&hellip;</h2>`;
  }
  const subs = state.aggData || [];
  const n = subs.length;

  if(state.aggError){
    return `<button class="backlink" data-go="facilitatorSetup">&#8592; Back</button><p class="eyebrow">Class ${code}</p><div class="error-banner">${state.aggError}</div><button class="btn ghost" id="refreshBtn">Try again</button>`;
  }

  if(n === 0){
    return `
      <button class="backlink" data-go="facilitatorSetup">&#8592; Back</button>
      <p class="eyebrow">Class ${code}</p>
      <h2 class="section-title">Live group results</h2>
      <div class="empty-state">
        <div class="big">&#9917;</div>
        <p>No submissions yet. Once people scan the QR code or enter <strong>${code}</strong>, their anonymous results will show up here.</p>
      </div>
      <button class="btn ghost" id="refreshBtn">Refresh</button>
    `;
  }

  const bands = [
    { key: "strong", label: "Strong (25)", color: "#6E7660" },
    { key: "good", label: "Very good (20\u201324)", color: "#8A8F55" },
    { key: "grow", label: "Room to grow (15\u201319)", color: "#A6822F" },
    { key: "focus", label: "Needs focus (<15)", color: "#9B4A38" }
  ];

  const rows = CATEGORIES.map(cat => {
    const scores = subs.map(s => s.scores[cat.name]).filter(v => typeof v === "number");
    const counts = { strong:0, good:0, grow:0, focus:0 };
    let sum = 0;
    scores.forEach(sc => { counts[bandFor(sc).key]++; sum += sc; });
    const avg = scores.length ? (sum/scores.length).toFixed(1) : "—";
    const segs = bands.map(b => {
      const w = scores.length ? (counts[b.key]/scores.length)*100 : 0;
      return `<span style="width:${w}%; background:${b.color};" title="${b.label}: ${counts[b.key]}"></span>`;
    }).join("");
    return `<div class="dist-row"><div class="cat-head"><span class="name">${cat.name}</span><span class="avg">avg ${avg}/25</span></div><div class="stack">${segs}</div></div>`;
  }).join("");

  const legend = bands.map(b => `<span class="item"><span class="swatch" style="background:${b.color};"></span>${b.label}</span>`).join("");

  return `
    <button class="backlink" data-go="facilitatorSetup">&#8592; Back to class setup</button>
    <p class="eyebrow">Class ${code} · ${n} response${n===1?"":"s"}</p>
    <h1 class="display">Where the room <em>stands</em>.</h1>
    <p class="lede">Anonymous, category by category. No names, no way to tell who answered what.</p>
    <div class="card">${rows}<div class="stack-legend">${legend}</div></div>
    <div class="btn-row">
      <button class="btn ghost" id="refreshBtn">Refresh results</button>
      <button class="btn ghost" id="exportBtn">Download as .csv</button>
    </div>
  `;
}

function exportCSV(code, subs){
  const header = ["submission_time", ...CATEGORIES.map(c => c.name)];
  const lines = [header.map(csvSafe).join(",")];
  subs.forEach(s => {
    const row = [new Date(s.created_at).toISOString(), ...CATEGORIES.map(c => (s.scores[c.name] ?? ""))];
    lines.push(row.map(csvSafe).join(","));
  });
  const csv = lines.join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `marriage-assessment-class-${code}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function csvSafe(v){
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}

function attachHandlers(){
  document.querySelectorAll("[data-go]").forEach(el => {
    el.addEventListener("click", () => { state.view = el.getAttribute("data-go"); render(); });
  });

  const leadClassBtn = document.getElementById("leadClassBtn");
  if(leadClassBtn) leadClassBtn.addEventListener("click", () => goToFacilitatorSetup(false));

  const newClassBtn = document.getElementById("newClassBtn");
  if(newClassBtn) newClassBtn.addEventListener("click", () => goToFacilitatorSetup(true));

  const codeInput = document.getElementById("codeInput");
  const startBtn = document.getElementById("startBtn");
  if(startBtn){
    startBtn.addEventListener("click", () => {
      state.classCode = (codeInput.value || "").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
      state.answers = {}; state.step = 0;
      state.view = "assessment";
      render();
    });
  }

  document.querySelectorAll(".scale-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const q = parseInt(btn.getAttribute("data-q"), 10);
      const v = parseInt(btn.getAttribute("data-v"), 10);
      if(!state.answers[state.step]) state.answers[state.step] = {};
      state.answers[state.step][q] = v;
      render();
    });
  });

  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn){
    nextBtn.addEventListener("click", () => {
      if(state.step < CATEGORIES.length - 1){
        state.step++; render(); window.scrollTo({top:0, behavior:"instant"});
      } else {
        finishAssessment();
      }
    });
  }

  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const name = el.getAttribute("data-toggle");
      state.expandedCategory = state.expandedCategory === name ? null : name;
      render();
    });
  });

  const printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.addEventListener("click", () => window.print());

  const lookupInput = document.getElementById("lookupInput");
  const lookupBtn = document.getElementById("lookupBtn");
  if(lookupBtn){
    lookupBtn.addEventListener("click", () => {
      const v = (lookupInput.value || "").toUpperCase().trim();
      state.lookupCode = v;
      if(v) runLookup(v);
    });
  }

  const genQrBtn = document.getElementById("genQrBtn");
  if(genQrBtn){
    genQrBtn.addEventListener("click", () => {
      const input = document.getElementById("shareUrlInput");
      let base = (input.value || "").trim();
      if(!base) return;
      state.qrUrl = base;
      const sep = base.includes("?") ? "&" : "?";
      const full = `${base}${sep}class=${state.facilitatorCode}`;
      document.getElementById("qrLinkText").textContent = full;
      const holder = document.getElementById("qrHolder");
      holder.style.display = "block";
      holder.innerHTML = `<img alt="QR code" style="border-radius:12px;" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(full)}">`;
    });
  }

  const openDashBtn = document.getElementById("openDashBtn");
  if(openDashBtn){
    openDashBtn.addEventListener("click", () => {
      state.aggCode = state.facilitatorCode;
      state.view = "facilitatorDash";
      loadAggregate(state.facilitatorCode);
    });
  }

  const refreshBtn = document.getElementById("refreshBtn");
  if(refreshBtn) refreshBtn.addEventListener("click", () => loadAggregate(state.aggCode || state.facilitatorCode));

  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.addEventListener("click", () => exportCSV(state.aggCode || state.facilitatorCode, state.aggData || []));
}

if(state.classCode){
  state.view = "assessment";
  state.answers = {};
  state.step = 0;
}
render();
</script>
</body>
</html>
