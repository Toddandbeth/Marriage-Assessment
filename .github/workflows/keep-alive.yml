name: Keep Supabase project awake

on:
  schedule:
    # Runs every Monday at 9am UTC. Supabase free projects pause after 7 days
    # of no activity, so this just needs to run at least once a week.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        # Queries a real table (the bare /rest/v1/ root is answered without
        # touching the database). --fail makes the run go red on any non-2xx
        # response instead of reporting success.
        run: |
          curl -sS --fail -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/submissions?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
